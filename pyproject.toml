[project]
name = "spacecraft-telemetry-anomaly-detection"
version = "1.0.0"
description = "LSTM forecasting with nonparametric dynamic thresholding vs simple baselines on NASA SMAP and MSL spacecraft telemetry, with event-level evaluation."
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
